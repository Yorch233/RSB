<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSB Results Viewer</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4eb;
            --text-secondary: #9ca3b0;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --player-bg: #111318;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        h1 {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; }
        h3 { font-size: 1rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

        /* Breadcrumb */
        .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; font-size: 0.875rem; color: var(--text-secondary); flex-wrap: wrap; }
        .breadcrumb a { color: var(--accent); text-decoration: none; }
        .breadcrumb a:hover { color: var(--accent-hover); }
        .breadcrumb .sep { user-select: none; }

        /* Cards grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 16px; cursor: pointer; transition: all 0.15s; text-decoration: none; color: var(--text); display: block;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-1px); }
        .card-icon { font-size: 1.5rem; margin-bottom: 8px; }
        .card-title { font-weight: 600; font-size: 0.95rem; word-break: break-all; }
        .card-sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }

        /* Info box */
        .info-box {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 20px; margin-bottom: 24px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;
        }
        .info-item label { display: block; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .info-item .value { font-size: 1rem; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .badge-success { background: rgba(34,197,94,0.15); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }

        /* Audio list */
        .audio-list { display: flex; flex-direction: column; gap: 4px; }
        .audio-row {
            display: flex; align-items: center; gap: 12px; padding: 8px 12px;
            background: var(--card); border: 1px solid var(--border); border-radius: 8px; transition: border-color 0.15s;
        }
        .audio-row:hover { border-color: var(--accent); }
        .audio-index { width: 48px; text-align: right; font-size: 0.8rem; color: var(--text-secondary); flex-shrink: 0; }
        .audio-name { flex: 1; font-size: 0.9rem; font-weight: 500; word-break: break-all; min-width: 0; }
        .audio-play {
            flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
            background: var(--accent); border: none; color: #fff; cursor: pointer;
            font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .audio-play:hover { background: var(--accent-hover); }
        .audio-play.playing { background: #ef4444; }

        /* Player bar */
        .player-bar {
            position: sticky; bottom: 0; background: var(--player-bg); border-top: 1px solid var(--border);
            padding: 12px 24px; display: flex; align-items: center; gap: 16px; margin-top: 24px;
        }
        .player-bar.hidden { display: none; }
        .player-filename { font-size: 0.85rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .player-bar audio { flex: 1; min-width: 0; height: 36px; }
        .player-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem; padding: 4px; }
        .player-close:hover { color: var(--text); }

        /* Pagination */
        .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; }
        .pagination a, .pagination span {
            padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; text-decoration: none;
            background: var(--card); border: 1px solid var(--border); color: var(--text); transition: all 0.15s;
        }
        .pagination a:hover { border-color: var(--accent); color: var(--accent); }
        .pagination .active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .pagination .disabled { opacity: 0.4; pointer-events: none; }

        /* Metrics table */
        .metrics-section { margin-top: 24px; }
        .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 8px 12px; text-align: right; white-space: nowrap; }
        th { background: var(--card); color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; }
        th:first-child, td:first-child { text-align: left; }
        tr:not(:last-child) { border-bottom: 1px solid var(--border); }
        tbody tr:hover { background: rgba(99,102,241,0.05); }

        .section-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; margin-top: 24px;
        }
        .section-header h2 { margin: 0; }
        .count { font-size: 0.85rem; color: var(--text-secondary); }

        audio::-webkit-media-controls-panel { background: var(--card); }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="player-bar hidden" id="playerBar">
        <span class="player-filename" id="playerFilename"></span>
        <audio controls id="playerAudio"></audio>
        <button class="player-close" onclick="closePlayer()" title="Close">&times;</button>
    </div>
    <script>
        const playerBar = document.getElementById('playerBar');
        const playerAudio = document.getElementById('playerAudio');
        const playerFilename = document.getElementById('playerFilename');
        let currentBtn = null;

        function playAudio(path, filename) {
            playerAudio.src = path;
            playerFilename.textContent = filename;
            playerBar.classList.remove('hidden');
            playerAudio.play();
            if (currentBtn) { currentBtn.classList.remove('playing'); currentBtn.textContent = '▶'; }
            const btn = document.querySelector(`[data-audio="${filename}"]`);
            if (btn) { btn.classList.add('playing'); btn.textContent = '⏸'; currentBtn = btn; }
        }

        function toggleAudio(el, path, filename) {
            if (currentBtn === el && !playerAudio.paused) {
                playerAudio.pause();
                el.classList.remove('playing');
                el.textContent = '▶';
                return;
            }
            playAudio(path, filename);
        }

        function closePlayer() {
            playerAudio.pause();
            playerAudio.src = '';
            playerBar.classList.add('hidden');
            if (currentBtn) { currentBtn.classList.remove('playing'); currentBtn.textContent = '▶'; currentBtn = null; }
        }

        playerAudio.addEventListener('ended', () => {
            if (currentBtn) { currentBtn.classList.remove('playing'); currentBtn.textContent = '▶'; currentBtn = null; }
        });
    </script>
</body>
</html>
