[project]
name = "regularized-schrodinger-bridge"
version = "1.0.0"
description = "Regularized Schrodinger Bridge for speech enhancement"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Yorch233" },
]
keywords = [
    "speech-enhancement",
    "schrodinger-bridge",
    "pytorch",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.30.2",
    "librosa>=0.11.0",
    "lightning>=2.5.0",
    "ninja",
    "numpy>=2.0",
    "onnxruntime>=1.22.0",
    "pandas>=2.3.0",
    "pesq>=0.0.4",
    "pystoi>=0.4.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=13.7.0",
    "safetensors>=0.7.0",
    "scipy>=1.14",
    "soundfile>=0.13.1",
    "tabulate>=0.9.0",
    "torch>=2.5.1,<2.6",
    "torchaudio>=2.5.1,<2.6",
    "torchinfo>=1.8.0",
    "tqdm>=4.67.1",
    "typer>=0.12.0",
    "wandb",
]

[project.scripts]
rsb = "RSB.cli.app:app"

[project.urls]
Homepage = "https://github.com/Yorch233/RSB"
Repository = "https://github.com/Yorch233/RSB"
Documentation = "https://github.com/Yorch233/RSB/tree/main/docs"
"Audio Demo" = "https://yorch233.github.io/RSB/"
"Model Hub" = "https://huggingface.co/Yorch233/RSB"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["RSB"]

[tool.ruff]
line-length = 120
lint.extend-select = [
    "ANN",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "PT",
    "RET",
    "S",
    "SIM",
    "UP",
    "W",
]
lint.ignore = [
    "ANN401",
    "D100",
    "D104",
    "S101",
    "S311",
]
lint.flake8-annotations.allow-star-arg-any = true
lint.pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["ANN", "D"]

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
